<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swift Interview Execution Sheet</title><style>
*{box-sizing:border-box} :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#475569;--line:#cbd5e1;--blue:#2563eb;--soft:#eff6ff} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} header,main{width:min(1500px,calc(100% - 28px));margin:auto} header{padding:18px 0 12px} a{color:var(--blue)} h1{font-size:24px;margin:5px 0} .warn{background:#fff7ed;border:1px solid #fdba74;padding:9px 12px;border-radius:8px;color:#9a3412}.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 3px #0001}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted)}.pill{border-radius:99px;background:var(--soft);padding:3px 8px;font-weight:650}.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.phase{min-width:0;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:8px;padding:11px;overflow-wrap:anywhere}.phase h2{font-size:15px;margin:0 0 8px}.phase h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:11px 0 4px}.phase p,.phase ul{margin:4px 0}.phase ul{padding-left:18px}.code{margin-top:12px}.source-region{max-height:720px;overflow:auto;border-radius:8px;background:#0f172a;min-width:0}.source-region pre{margin:0;min-width:max-content;padding:14px;color:#e2e8f0;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.tok-comment{color:#94a3b8;font-style:italic}.tok-string{color:#bef264}.tok-keyword{color:#93c5fd;font-weight:600}.tok-type{color:#67e8f9}.tok-number{color:#fda4af}.error{padding:30px;text-align:center}@media(max-width:900px){.phases{grid-template-columns:1fr 1fr}}@media(max-width:560px){.phases{grid-template-columns:1fr}header,main{width:min(100% - 14px,1500px)}.sheet{padding:10px}}@media print{@page{size:landscape;margin:8mm}body{background:#fff;font-size:9px}header{display:none}main{width:100%}.sheet{border:0;box-shadow:none;padding:0}.phases{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.phase{padding:6px;break-inside:avoid}.phase h2{font-size:11px}.phase h3{font-size:8px;margin:5px 0 2px}.code{break-before:page}.source-region{max-height:none}.source-region pre{white-space:pre-wrap;min-width:0;font-size:7px;line-height:1.3;color:#111;background:#f8fafc;border:1px solid #ccc}}
</style></head><body><header><a href="index.html">← Problem index</a><h1 id="title">Swift interview execution sheet</h1><p class="warn"><strong>Prep sheet — full solution visible.</strong> This is separate from the practice journey and never opens from a practice run.</p></header><main id="app"><p class="error">Loading the on-demand prep sheet…</p></main><script src="journey-data.js"></script><script src="problem-source-viewer.js"></script><script>
(function(){"use strict";var key=new URLSearchParams(location.search).get("problem"),p=window.JOURNEY_PROBLEMS&&window.JOURNEY_PROBLEMS[key],app=document.getElementById("app");if(!p||p.language!=="swift"){app.innerHTML='<p class="error">Swift prep sheet not found. <a href="index.html">Return to the catalogue.</a></p>';return}var s=document.createElement("script");s.src="journey-execution/"+key+".js";s.onerror=function(){app.innerHTML='<p class="error">Generated prep sheet unavailable. Run the journey generator.</p>'};s.onload=render;document.head.appendChild(s);function e(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}function list(v){return '<ul>'+v.map(function(x){return '<li>'+e(x)+'</li>'}).join('')+'</ul>'}function field(name,v){return '<h3>'+e(name)+'</h3>'+(Array.isArray(v)?list(v):'<p>'+e(v)+'</p>')}function phase(n,title,data,budget){return '<section class="phase"><h2>'+n+'. '+title+' · '+budget+' min</h2>'+Object.keys(data).map(function(k){return field(k.replace(/([A-Z])/g,' $1'),data[k])}).join('')+'</section>'}function render(){var x=window.INTERVIEW_EXECUTION&&window.INTERVIEW_EXECUTION[key];if(!x){s.onerror();return}document.title=p.title+' — Interview Execution';document.getElementById('title').textContent=p.title;app.innerHTML='<article class="sheet"><div class="meta"><span class="pill">45 minutes</span><span class="pill">All four phases visible</span><span class="pill">Print: landscape</span></div><div class="phases">'+phase(1,'Problem navigation',x.navigation,x.timeBudget.navigation)+phase(2,'Problem solution',x.solution,x.timeBudget.solution)+phase(3,'Coding',x.coding,x.timeBudget.coding)+phase(4,'Verification',x.verification,x.timeBudget.verification)+'</div><section class="code"><h2>Full working code</h2>'+ProblemSourceViewer.region(x.code,'swift','Full working implementation')+'</section></article>'}
}());</script></body></html>
