<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Practice — Problem Index</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
      --shadow-hover: 0 4px 14px rgba(0,0,0,.11);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.4rem 2rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.2rem; }
    header .header-nav a { color: var(--accent); font-weight: 600; text-decoration: none; }
    header .header-nav a:hover { text-decoration: underline; }

    /* ── Filters ── */
    .filters {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
      max-width: 320px;
    }
    .search-wrap svg {
      position: absolute;
      left: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      padding: 0.45rem 0.75rem 0.45rem 2.1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.875rem;
      color: var(--text-primary);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: var(--accent); background: #fff; }
    .search-wrap input::placeholder { color: var(--text-muted); }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filter-btn {
      padding: 0.28rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.8rem;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.12s;
      font-weight: 500;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .active-tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.55rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 500;
      font-family: ui-monospace, "Cascadia Code", monospace;
    }
    .active-tag-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-size: 0.95rem;
      line-height: 1;
      padding: 0;
      opacity: 0.7;
    }
    .active-tag-chip button:hover { opacity: 1; }

    /* ── Main ── */
    main { max-width: 1200px; margin: 0 auto; padding: 1.25rem 2rem 3rem; }

    .results-bar { margin-bottom: 0.85rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
    .results-count { font-size: 0.8rem; color: var(--text-muted); }
    .results-note {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.25rem 0.6rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 500;
    }
    .results-note:empty { display: none; }
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: var(--accent);
      text-decoration: underline;
    }
    .link-btn:hover { opacity: 0.75; }

    /* ── Grid ── */
    .problem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    /* ── Card ── */
    .problem-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      transition: box-shadow 0.15s, border-color 0.15s;
      min-width: 0;
    }
    .problem-card.expanded { grid-column: 1 / -1; }
    .problem-card:hover { box-shadow: var(--shadow-hover); border-color: var(--border-hover); }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .card-num {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      font-family: ui-monospace, "Cascadia Code", monospace;
      letter-spacing: 0.06em;
      flex-shrink: 0;
      padding-top: 3px;
    }
    .card-title {
      font-size: 0.975rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      flex: 1;
    }
    .parts-badge {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      white-space: nowrap;
    }

    .card-desc {
      font-size: 0.855rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Language */
    .badge-python { background: #e8f0fe; color: #1e40af; }
    .badge-react  { background: #e0f7fa; color: #006064; }
    .badge-swift  { background: #fff1ed; color: #b42318; }

    /* Industry — add a new rule here when adding a new industry value */
    .badge-general      { background: #f1f5f9; color: #475569; }
    .badge-health-tech  { background: #dcfce7; color: #166534; }
    .badge-iot          { background: #fef9c3; color: #713f12; }
    .badge-dev-tools    { background: #f3e8ff; color: #581c87; }
    .badge-fintech        { background: #d1fae5; color: #064e3b; }
    .badge-public-safety  { background: #dbeafe; color: #1e3a8a; }
    .badge-legal-tech     { background: #fef3c7; color: #92400e; }
    .badge-commerce       { background: #ffe4e6; color: #9f1239; }
    .badge-logistics      { background: #ccfbf1; color: #115e59; }

    /* Level */
    .badge-level-junior    { background: #f1f5f9; color: #64748b; }
    .badge-level-mid-level { background: #e0f2fe; color: #0369a1; }
    .badge-level-senior    { background: #fff7ed; color: #c2410c; }
    .badge-level-staff     { background: #f5f3ff; color: #7c3aed; }

    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.42rem;
      cursor: pointer;
      transition: all 0.1s;
      font-family: ui-monospace, "Cascadia Code", monospace;
      user-select: none;
    }
    .tag:hover { color: var(--accent); border-color: #93c5fd; }
    .tag.active { color: var(--accent); border-color: #93c5fd; background: #eff6ff; }

    .file-path {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 0.1rem;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.38rem 0.7rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.12s;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .action-primary { background: var(--accent); color: #fff; }
    .action-primary:hover { background: var(--accent-hover); }
    .action-secondary { background: var(--surface); color: var(--text-secondary); border-color: var(--border); }
    .action-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Empty state ── */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .no-results p { font-size: 0.875rem; margin-top: 0.4rem; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(0.75rem);
      background: #0f172a;
      color: #fff;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Generated source reader ── */
    .source-reader { min-width: 0; margin-top: .25rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .source-reader-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: .7rem; }
    .source-reader h3 { margin: 0; font-size: 1rem; }
    .source-reader-note { margin: .18rem 0 0; color: var(--text-muted); font-size: .78rem; }
    .source-tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .65rem; }
    .source-tab { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-secondary); padding: .38rem .7rem; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 600; }
    .source-tab[aria-selected="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
    .source-file-label { margin: 0 0 .45rem; color: var(--text-muted); font: .7rem ui-monospace, "Cascadia Code", Menlo, monospace; overflow-wrap: anywhere; }
    .source-region { max-height: min(70vh, 760px); overflow: auto; overscroll-behavior: contain; border: 1px solid #1e293b; border-radius: 8px; background: #0f172a; min-width: 0; }
    .source-region pre { margin: 0; padding: 1rem 1.15rem; min-width: max-content; color: #e2e8f0; font: .8rem/1.65 ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; tab-size: 4; white-space: pre; }
    .tok-comment { color: #94a3b8; font-style: italic; } .tok-string { color: #bef264; } .tok-keyword { color: #93c5fd; font-weight: 600; } .tok-type { color: #67e8f9; } .tok-number { color: #fda4af; }
    .source-loading, .source-error { padding: 1rem; border-radius: 7px; background: var(--bg); color: var(--text-secondary); font-size: .85rem; }
    @media (max-width: 540px) { main { padding-inline: .75rem; } .problem-grid { grid-template-columns: minmax(0, 1fr); } .source-reader-head { flex-direction: column; } }
  </style>
</head>

// ============================================================

// ── Derived from the file's own URL — works for any local clone ──────────────
const repoRoot = window.location.pathname.replace(/\/index\.html$/, "");

// ── Filter state ─────────────────────────────────────────────────────────────
const LEVELS = ["junior", "mid-level", "senior", "staff"]; // canonical order
const state = { search: "", language: null, industry: null, level: null, tag: null, expanded: null, sourceTab: "stub" };

// The captain's language choice is remembered across reloads. Swift is only the
// first-run default, and it applies only while the catalogue still has Swift
// problems. `null` (stored as "all") means every language.
const LANGUAGE_PREF_KEY = "practice-index.language";
const DEFAULT_LANGUAGE = "swift";
const ALL_LANGUAGES = "all";

function catalogueLanguages() { return new Set(PROBLEMS.map(p => p.language)); }

function readLanguagePref() {
  try { return window.localStorage.getItem(LANGUAGE_PREF_KEY); } catch { return null; }
}

function writeLanguagePref(language) {
  try { window.localStorage.setItem(LANGUAGE_PREF_KEY, language || ALL_LANGUAGES); } catch { /* storage unavailable — the choice just won't persist */ }
}

function initialLanguage() {
  const available = catalogueLanguages();
  const stored = readLanguagePref();
  if (stored) return stored !== ALL_LANGUAGES && available.has(stored) ? stored : null;
  return available.has(DEFAULT_LANGUAGE) ? DEFAULT_LANGUAGE : null;
}
window.PROBLEM_SOURCES = window.PROBLEM_SOURCES || {};
const sourceLoads = {};

// ── Helpers ──────────────────────────────────────────────────────────────────
const unique = arr => [...new Set(arr)];
const label  = key => key.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");

function problemNum(path) {
  const m = path.match(/problem_(\d+)/);
  return m ? `#${m[1]}` : "";
}

function problemKey(p) { return `${p.language}-${(p.path.match(/problem_(\d+)/) || [null, ""])[1]}`; }

function sourceReader(p) {
  const key = problemKey(p), payload = window.PROBLEM_SOURCES[key];
  if (!payload) return `<section class="source-reader" aria-label="Problem source"><div class="source-loading" role="status">Loading source…</div></section>`;
  const selected = state.sourceTab === "test" && payload.test ? "test" : "stub";
  const file = payload[selected];
  return `<section class="source-reader" aria-labelledby="source-title-${key}">
    <div class="source-reader-head"><div><h3 id="source-title-${key}">${selected === "stub" ? "Problem statement and stub" : "Test specification"}</h3><p class="source-reader-note">Generated from the repository source. Scroll inside the code region for long files.</p></div><button type="button" class="action-btn action-secondary" data-close-source>Close reader</button></div>
    <div class="source-tabs" role="tablist" aria-label="Choose source file">
      <button type="button" class="source-tab" role="tab" data-source-tab="stub" aria-selected="${selected === "stub"}">Problem stub</button>
      ${payload.test ? `<button type="button" class="source-tab" role="tab" data-source-tab="test" aria-selected="${selected === "test"}">Tests</button>` : ""}
    </div>
    <p class="source-file-label">${ProblemSourceViewer.escape(file.path)}</p>
    ${ProblemSourceViewer.region(file.source, payload.language, `${selected === "stub" ? "Problem stub" : "Test file"}: ${file.path}`)}
  </section>`;
}

function loadSource(p) {
  const key = problemKey(p);
  if (window.PROBLEM_SOURCES[key]) { renderCards(); return; }
  if (sourceLoads[key]) return;
  const script = document.createElement("script");
  script.src = `journey-sources/${key}.js`;
  script.onload = () => { sourceLoads[key] = "loaded"; renderCards(); requestAnimationFrame(() => document.querySelector(`[data-card-key="${key}"] .source-reader`)?.scrollIntoView({block: "nearest"})); };
  script.onerror = () => { sourceLoads[key] = "error"; renderCards(); };
  sourceLoads[key] = "loading";
  document.head.appendChild(script);
}

function matchesFilters(p) {
  if (state.language && p.language !== state.language) return false;
  if (state.industry && p.industry !== state.industry) return false;
  if (state.level    && p.level    !== state.level)    return false;
  if (state.tag     && !p.tags.includes(state.tag))    return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    const hay = [p.title, p.description, ...p.tags].join(" ").toLowerCase();
    if (!q.split(/\s+/).filter(Boolean).every(t => hay.includes(t))) return false;
  }
  return true;
}

function copyPath(path) {
  navigator.clipboard.writeText(path).then(() => {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  });
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderFilters() {
  const langs = unique(PROBLEMS.map(p => p.language));
  const inds   = unique(PROBLEMS.map(p => p.industry));

  document.getElementById("language-filters").innerHTML =
    `<span class="filter-label">Language</span>` +
    ["all", ...langs].map(l => {
      const active = l === "all" ? !state.language : state.language === l;
      return `<button class="filter-btn${active ? " active" : ""}" data-lang="${l}">${l === "all" ? "All" : label(l)}</button>`;
    }).join("");

  document.getElementById("industry-filters").innerHTML =
    `<span class="filter-label">Industry</span>` +
    ["all", ...inds].map(i => {
      const active = i === "all" ? !state.industry : state.industry === i;
      return `<button class="filter-btn${active ? " active" : ""}" data-industry="${i}">${i === "all" ? "All" : label(i)}</button>`;
    }).join("");

  document.getElementById("level-filters").innerHTML =
    `<span class="filter-label">Level</span>` +
    ["all", ...LEVELS].map(lv => {
      const active = lv === "all" ? !state.level : state.level === lv;
      return `<button class="filter-btn${active ? " active" : ""}" data-level="${lv}">${lv === "all" ? "All" : label(lv)}</button>`;
    }).join("");

  document.getElementById("tag-chip").innerHTML = state.tag
    ? `<span class="active-tag-chip">#${state.tag}<button onclick="setTag(null)" title="Clear tag filter">×</button></span>`
    : "";
}

function renderCards() {
  const filtered = PROBLEMS.filter(matchesFilters);

  document.getElementById("results-count").textContent =
    filtered.length === PROBLEMS.length
      ? `${PROBLEMS.length} problems`
      : `${filtered.length} of ${PROBLEMS.length} problems`;

  const note = document.getElementById("results-note");
  if (state.language) {
    const hidden = PROBLEMS.filter(p => p.language !== state.language).length;
    note.innerHTML =
      `Showing ${label(state.language)} only - ${hidden} problem${hidden === 1 ? "" : "s"} in other languages hidden. ` +
      `<button type="button" class="link-btn" data-clear-language>Show all languages</button>`;
  } else {
    note.innerHTML = "";
  }

  if (filtered.length === 0) {
    document.getElementById("problem-grid").innerHTML =
      `<div class="no-results"><strong>No problems match your filters.</strong><p>Try clearing some filters or adjusting your search.</p></div>`;
    return;
  }

  document.getElementById("problem-grid").innerHTML = filtered.map(p => {
    const vscodeProblem = `vscode://file${repoRoot}/${p.path}`;
    const vscodeTest    = p.test ? `vscode://file${repoRoot}/${p.test}` : null;

    const tagHtml = p.tags.map(t =>
      `<span class="tag${state.tag === t ? " active" : ""}" onclick="setTag('${t}')">#${t}</span>`
    ).join("");

    const testBtn = vscodeTest
      ? `<a href="${vscodeTest}" class="action-btn action-secondary">Test file ↗</a>`
      : "";

    const journeyKey = problemKey(p);
    const journeyBtn = window.JOURNEY_PROBLEMS?.[journeyKey]
      ? `<a href="journey.html?problem=${journeyKey}" class="action-btn action-secondary">Start journey →</a>`
      : "";
    const prepBtn = p.language === "swift"
      ? `<a href="interview-execution.html?problem=${journeyKey}" class="action-btn action-secondary" title="Opens a separate prep-only page containing the full solution">Interview prep sheet ⚠</a>`
      : "";

    return `
<article class="problem-card${state.expanded === problemKey(p) ? " expanded" : ""}" data-card-key="${problemKey(p)}">
  <div class="card-header">
    <span class="card-num">${problemNum(p.path)}</span>
    <span class="card-title">${p.title}</span>
    <span class="parts-badge">${p.parts} parts</span>
  </div>
  <p class="card-desc">${p.description}</p>
  <div class="badges">
    <span class="badge badge-${p.language}">${label(p.language)}</span>
    <span class="badge badge-${p.industry}">${label(p.industry)}</span>
    <span class="badge badge-level-${p.level}">${label(p.level)}</span>
  </div>
  <div class="tags">${tagHtml}</div>
  <p class="file-path">${p.path}</p>
  <div class="card-actions">
    <button type="button" class="action-btn action-secondary" data-read-source>Read problem</button>
    <a href="${vscodeProblem}" class="action-btn action-primary">Open in VS Code ↗</a>
    ${journeyBtn}
    ${prepBtn}
    ${testBtn}
    <button class="action-btn action-secondary" onclick="copyPath('${p.path}')">Copy path</button>
  </div>
  ${state.expanded === problemKey(p) ? (sourceLoads[problemKey(p)] === "error" ? `<section class="source-reader"><div class="source-error" role="alert">Source could not be loaded. Regenerate the journey data and try again.</div></section>` : sourceReader(p)) : ""}
</article>`;
  }).join("");
}

function render() { renderFilters(); renderCards(); }

// ── Public helpers called from inline handlers ────────────────────────────────
function setTag(tag) {
  state.tag = state.tag === tag ? null : tag;
  render();
}

// ── Events ───────────────────────────────────────────────────────────────────
document.getElementById("search-input").addEventListener("input", e => {
  state.search = e.target.value.trim();
  render();
});

document.getElementById("language-filters").addEventListener("click", e => {
  const btn = e.target.closest("[data-lang]");
  if (!btn) return;
  state.language = btn.dataset.lang === ALL_LANGUAGES ? null : btn.dataset.lang;
  writeLanguagePref(state.language);
  render();
});

document.querySelector(".results-bar").addEventListener("click", e => {
  if (!e.target.closest("[data-clear-language]")) return;
  state.language = null;
  writeLanguagePref(null);
  render();
});

document.getElementById("industry-filters").addEventListener("click", e => {
  const btn = e.target.closest("[data-industry]");
  if (!btn) return;
  state.industry = btn.dataset.industry === "all" ? null : btn.dataset.industry;
  render();
});

document.getElementById("level-filters").addEventListener("click", e => {
  const btn = e.target.closest("[data-level]");
  if (!btn) return;
  state.level = btn.dataset.level === "all" ? null : btn.dataset.level;
  render();
});

document.getElementById("problem-grid").addEventListener("click", e => {
  const card = e.target.closest("[data-card-key]");
  if (!card) return;
  const key = card.dataset.cardKey;
  if (e.target.closest("[data-read-source]")) {
    state.expanded = key; state.sourceTab = "stub"; renderCards();
    loadSource(PROBLEMS.find(p => problemKey(p) === key));
  } else if (e.target.closest("[data-close-source]")) {
    state.expanded = null; renderCards(); card.querySelector("[data-read-source]")?.focus();
  } else if (e.target.closest("[data-source-tab]")) {
    state.sourceTab = e.target.closest("[data-source-tab]").dataset.sourceTab; renderCards();
    document.querySelector(`[data-card-key="${key}"] [data-source-tab="${state.sourceTab}"]`)?.focus();
  }
});

// ── Init ─────────────────────────────────────────────────────────────────────
state.language = initialLanguage();

// `?tag=<tag>` opens the catalogue pre-filtered on one tag, which is how
// patterns.html links a pattern family to the problems that drill it. It reuses
// the same `state.tag` the tag chips set, so there is one filtering path. The
// remembered language filter is stood down for the session (the stored
// preference is untouched) so an incoming tag link never lands on an empty grid
// just because the tag belongs to another language.
const tagParam = new URLSearchParams(window.location.search).get("tag");
if (tagParam && PROBLEMS.some(p => p.tags.includes(tagParam))) {
  state.tag = tagParam;
  state.language = null;
}

render();
</script>
</body>
</html>
