  "python-03": {
    "approach": [
      {
        "part": 1,
        "prompt": "Which mappings make role updates and a user's permission union straightforward?",
        "concepts": [
          "role IDs map to permission sets",
          "user IDs map to assigned role IDs"
        ],
        "steps": [
          "Validate role IDs at mutation boundaries.",
          "Return permission snapshots rather than internal collections."
        ],
        "pitfalls": [
          "class-level mutable state",
          "returning an internal set by reference"
        ]
      },
      {
        "part": 2,
        "prompt": "How can inherited permissions extend the same effective-permission query?",
        "concepts": [
          "parent links",
          "transitive traversal"
        ],
        "steps": [
          "Store one parent link per role.",
          "Make existing permission queries include ancestors."
        ],
        "pitfalls": [
          "checking only the immediate parent",
          "duplicating permission logic"
        ]
      },
      {
        "part": 3,
        "prompt": "How can wildcard matching stay separate from permission collection?",
        "concepts": [
          "resource/action pairs",
          "exact and wildcard candidates"
        ],
        "steps": [
          "Reuse the effective permission set.",
          "Compare it with the finite set of patterns that cover the request."
        ],
        "pitfalls": [
          "treating malformed permissions as wildcards",
          "forgetting inherited wildcard permissions"
        ]
      }
    ],
    "verify": {
      "commonFailures": [
        {
          "symptom": "Tests pass alone but fail as a suite",
          "cause": "Mutable role or user state is shared",
          "check": "Initialize every collection on each manager instance."
        },
        {
          "symptom": "Direct permissions pass but inherited checks fail",
          "cause": "Queries inspect only a role's own set",
          "check": "Trace the effective-permission query through every ancestor."
        }
      ]
    },
    "lesson": {
      "parts": [
        {
          "part": 1,
          "steps": [
            {
              "explanation": "Start with two indexes: roles map to permission sets, and users map to role-ID sets. Sets make grants and assignments naturally idempotent, while returning unions and copies keeps callers from mutating the manager's state.",
              "code": "def __init__(self):\n    self._roles = {}\n    self._user_roles = {}\n    self._parents = {}\n\ndef create_role(self, role_id, permissions=None):\n    if role_id in self._roles:\n        raise ValueError(f\"role already exists: {role_id}\")\n    self._roles[role_id] = set(permissions or [])\n\ndef _role(self, role_id):\n    if role_id not in self._roles:\n        raise KeyError(role_id)\n    return self._roles[role_id]\n\ndef grant_permission(self, role_id, permission):\n    self._role(role_id).add(permission)\n\ndef revoke_permission(self, role_id, permission):\n    self._role(role_id).discard(permission)\n\ndef assign_role(self, user_id, role_id):\n    self._role(role_id)\n    self._user_roles.setdefault(user_id, set()).add(role_id)\n\ndef unassign_role(self, user_id, role_id):\n    self._role(role_id)\n    roles = self._user_roles.get(user_id, set())\n    if role_id not in roles:\n        raise KeyError(role_id)\n    roles.remove(role_id)\n\ndef get_role_permissions(self, role_id):\n    return set(self._role(role_id))\n\ndef get_all_permissions(self, user_id):\n    result = set()\n    for role_id in self._user_roles.get(user_id, set()):\n        result.update(self.get_role_permissions(role_id))\n    return result\n\ndef has_permission(self, user_id, permission):\n    return permission in self.get_all_permissions(user_id)",
              "rejected": "Separate Role and User objects add identity and mutability without helping this public contract. Class-level registries are especially dangerous because they leak between manager instances."
            }
          ]
        },
        {
          "part": 2,
          "steps": [
            {
              "explanation": "Inheritance belongs in the role-permission query. Walking parent links there means every higher-level user query automatically gains transitive inheritance without a second implementation.",
              "code": "def set_parent_role(self, role_id, parent_role_id):\n    self._role(role_id)\n    self._role(parent_role_id)\n    self._parents[role_id] = parent_role_id\n\ndef get_role_permissions(self, role_id):\n    permissions = set()\n    current = role_id\n    while current is not None:\n        permissions.update(self._role(current))\n        current = self._parents.get(current)\n    return permissions",
              "rejected": "Copying parent permissions into the child at assignment time looks simple, but later grants and parent replacement would leave stale copies. Traversing the live links preserves one source of truth."
            }
          ]
        },
        {
          "part": 3,
          "steps": [
            {
              "explanation": "Collection and matching stay separate. First reuse the effective permission union, then compare against the only four patterns that can cover one resource/action request. Malformed strings cannot match because none equals a valid candidate.",
              "code": "def has_scoped_permission(self, user_id, resource, action):\n    candidates = {\n        f\"{resource}:{action}\",\n        f\"{resource}:*\",\n        f\"*:{action}\",\n        \"*:*\",\n    }\n    return bool(self.get_all_permissions(user_id) & candidates)",
              "rejected": "Splitting every stored permission and branching on wildcard positions is longer and easier to get wrong. Generating four candidates makes the finite matching rule explicit."
            }
          ]
        }
      ],
      "reflection": "The transferable idea is to build one authoritative query at the lowest useful layer. Role permissions own inheritance; user permissions compose role permissions; scoped checks consume user permissions. Each new requirement extends the chain instead of creating parallel truth."
    }
  },
  "react-02": {
    "approach": [
      {
        "part": 1,
        "prompt": "What state and lifecycle boundary should own streamed incidents?",
        "concepts": [
          "effect cleanup",
          "immutable state updates"
        ],
        "steps": [
          "Subscribe once when the dashboard mounts.",
          "Derive the active newest-first view from received incidents."
        ],
        "pitfalls": [
          "leaking a subscription on unmount",
          "mutating the shared seed records"
        ]
      },
      {
        "part": 2,
        "prompt": "Which values are source state and which are derived display state?",
        "concepts": [
          "controlled filters",
          "memoized derivation"
        ],
        "steps": [
          "Keep incidents and filter selections as separate state.",
          "Derive the visible list without reconnecting the feed."
        ],
        "pitfalls": [
          "filtering incidents out of source state",
          "placing filter state in the subscription effect dependencies"
        ]
      },
      {
        "part": 3,
        "prompt": "What snapshot is needed to roll back one optimistic containment request?",
        "concepts": [
          "optimistic updates",
          "per-item pending and error state"
        ],
        "steps": [
          "Mark only the selected incident optimistically.",
          "On rejection, restore it and expose a retryable error."
        ],
        "pitfalls": [
          "one global loading flag",
          "rollback that overwrites newer streamed state"
        ]
      }
    ],
    "verify": {
      "commonFailures": [
        {
          "symptom": "Rows never appear",
          "cause": "The feed was not connected or subscribed",
          "check": "Confirm mount setup and unmount cleanup are both wired."
        },
        {
          "symptom": "Playwright cannot find a control",
          "cause": "A required data-testid changed",
          "check": "Compare the rendered attribute with the stub contract."
        }
      ]
    },
    "lesson": {
      "parts": [
        {
          "part": 1,
          "steps": [
            {
              "explanation": "Keep the stream as source state and subscribe exactly once. A functional state update avoids closing over a stale array; deriving and sorting active rows leaves the received records untouched.",
              "code": "const [incidents, setIncidents] = useState([])\n\nuseEffect(() => {\n  return incidentFeed.subscribe(incident => {\n    setIncidents(current => [incident, ...current])\n  })\n}, [])\n\nconst activeIncidents = incidents\n  .filter(incident => !incident.contained)\n  .sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts))\n\nfunction relativeTime(ts) {\n  const minutes = Math.max(0, Math.floor((Date.now() - Date.parse(ts)) / 60_000))\n  return `${minutes} min ago`\n}",
              "rejected": "Putting the feed connection in this component would duplicate App's ownership. Mutating SEED_INCIDENTS or sorting the state array in place would corrupt shared/source data."
            },
            {
              "explanation": "Render the contract directly, including the required test IDs. The severity map is presentation data, so it can style the badge without adding another state variable.",
              "code": "{activeIncidents.map(incident => (\n  <article key={incident.id} data-testid=\"incident-row\">\n    <span data-testid=\"severity-badge\" style={SEVERITY_COLORS[incident.severity]}>\n      {incident.severity}\n    </span>\n    <strong>{incident.type}</strong> · {incident.location}\n    <small>{relativeTime(incident.ts)}</small>\n  </article>\n))}\n{activeIncidents.length === 0 && <p>No incidents yet.</p>}"
            }
          ]
        },
        {
          "part": 2,
          "steps": [
            {
              "explanation": "Filters describe the view, not the feed. Store each selection independently and memoize a projection from incidents plus those selections; the subscription effect still has no filter dependency and therefore never restarts.",
              "code": "const [severityFilter, setSeverityFilter] = useState('all')\nconst [typeFilter, setTypeFilter] = useState('all')\n\nconst visibleIncidents = useMemo(() => incidents\n  .filter(incident => !incident.contained)\n  .filter(incident => severityFilter === 'all' || incident.severity === severityFilter)\n  .filter(incident => typeFilter === 'all' || incident.type === typeFilter)\n  .sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts)),\n  [incidents, severityFilter, typeFilter]\n)",
              "rejected": "Deleting nonmatching incidents from state loses information and makes changing a filter irreversible. Adding filters to the effect dependency list tears down and recreates the subscription."
            },
            {
              "explanation": "Controlled selects make the state-to-view relationship visible and give the count for free from the memoized array.",
              "code": "<label>Severity <select data-testid=\"filter-severity\" value={severityFilter} onChange={event => setSeverityFilter(event.target.value)}>\n  <option value=\"all\">all</option>\n  {SEVERITIES.map(value => <option key={value} value={value}>{value}</option>)}\n</select></label>\n<label>Type <select data-testid=\"filter-type\" value={typeFilter} onChange={event => setTypeFilter(event.target.value)}>\n  <option value=\"all\">all</option>\n  {INCIDENT_TYPES.map(value => <option key={value} value={value}>{value}</option>)}\n</select></label>\n<span>{visibleIncidents.length} visible</span>"
            }
          ]
        },
        {
          "part": 3,
          "steps": [
            {
              "explanation": "Pending and errors are per incident because requests can overlap. Optimistically flip only the chosen record, then merge success or rollback into the latest state with functional updates.",
              "code": "const [pendingIds, setPendingIds] = useState(() => new Set())\nconst [errors, setErrors] = useState({})\n\nconst handleContain = useCallback(async id => {\n  setPendingIds(current => new Set(current).add(id))\n  setErrors(current => ({ ...current, [id]: undefined }))\n  setIncidents(current => current.map(item => item.id === id ? { ...item, contained: true } : item))\n  try {\n    await containIncident(id)\n  } catch (_) {\n    setIncidents(current => current.map(item => item.id === id ? { ...item, contained: false } : item))\n    setErrors(current => ({ ...current, [id]: 'Failed — retry' }))\n  } finally {\n    setPendingIds(current => { const next = new Set(current); next.delete(id); return next })\n  }\n}, [])",
              "rejected": "A single loading Boolean disables every row. Restoring a captured incidents array on failure can erase records that arrived while the request was in flight."
            },
            {
              "explanation": "Revise the active projection to retain an optimistically contained row while its request is pending; otherwise the disabled button disappears immediately. Confirmed records then move to the separate derived section.",
              "code": "// In visibleIncidents, replace the active filter with:\n.filter(incident => !incident.contained || pendingIds.has(incident.id))\n\nconst confirmedContained = incidents.filter(item => item.contained && !pendingIds.has(item.id))\n\n<button data-testid=\"contain-btn\" disabled={pendingIds.has(incident.id)} onClick={() => handleContain(incident.id)}>\n  {pendingIds.has(incident.id) ? 'Containing…' : 'Contain'}\n</button>\n{errors[incident.id] && <span>{errors[incident.id]}</span>}\n\n<section><h3>Contained</h3>{confirmedContained.map(incident => (\n  <article key={incident.id} data-testid=\"contained-row\">{incident.type} · {incident.location}</article>\n))}</section>"
            }
          ]
        }
      ],
      "reflection": "The core React lesson is to separate source state, derived display state, and transient request state. Effects own external lifecycles, memoized projections own filtering, and functional updates make asynchronous optimistic work compose safely with a continuing stream."
    }
  },
  "swift-18": {
    "approach": [
      {
        "part": 1,
        "prompt": "What snapshot can carry both the stock facts and the reason an availability check failed?",
        "concepts": [
          "actor-isolated state",
          "typed Result outcomes",
          "available versus reserved units"
        ],
        "steps": [
          "Derive one immutable snapshot from on-hand and reserved counts.",
          "Make adjustment validation reuse the same availability boundary."
        ],
        "pitfalls": [
          "allowing negative available stock",
          "returning an opaque Bool or thrown string"
        ]
      },
      {
        "part": 2,
        "prompt": "Where must idempotency lookup, availability validation, and reservation mutation occur to make overselling impossible?",
        "concepts": [
          "actor serialization",
          "idempotency-key replay",
          "single mutation boundary"
        ],
        "steps": [
          "Check the idempotency key before validating replay arguments.",
          "Consume the Part 1 availability result before recording one reservation."
        ],
        "pitfalls": [
          "checking availability outside the actor",
          "incrementing stock twice on key replay"
        ]
      },
      {
        "part": 3,
        "prompt": "How can expiry and commit share reservation transitions while preserving all-or-nothing order behavior?",
        "concepts": [
          "injected time",
          "validate-then-apply",
          "terminal reservation states"
        ],
        "steps": [
          "Collect eligible IDs, then expire them through release.",
          "Resolve and validate every commit member before applying any terminal transition."
        ],
        "pitfalls": [
          "using the wall clock",
          "partially committing before a later reservation fails"
        ]
      }
    ],
    "verify": {
      "commonFailures": [
        {
          "symptom": "Concurrent attempts reserve more than the SKU owns",
          "cause": "Availability and mutation are split across isolation boundaries",
          "check": "Trace both operations through one uninterrupted actor method."
        },
        {
          "symptom": "A replay changes counters or returns a new ID",
          "cause": "The key lookup happens after request validation or mutation",
          "check": "Make an existing idempotency key the first successful return path."
        },
        {
          "symptom": "A failed multi-reservation commit changes earlier reservations",
          "cause": "Validation and mutation are interleaved",
          "check": "Resolve the complete active set before closing any reservation."
        }
      ]
    },
    "lesson": {
      "parts": [
        {
          "part": 1,
          "steps": [
            {
              "explanation": "Inside the actor, two integer dictionaries are sufficient: on-hand stock and active reserved totals. Every public answer is an immutable snapshot derived from those stores, so no mutable actor state escapes.",
              "code": "private var stock: [String: Int]\nprivate var reserved: [String: Int] = [:]\nprivate var reservations: [String: Reservation] = [:]\nprivate var reservationIDByKey: [String: String] = [:]\nprivate var orders: [String: CommittedOrder] = [:]\n\npublic init(initialStock: [String: Int] = [:]) { self.stock = initialStock }\n\npublic func snapshot(for sku: String) -> Result<InventorySnapshot, InventoryError> {\n    guard let onHand = stock[sku] else { return .failure(.unknownSKU(sku)) }\n    let held = reserved[sku, default: 0]\n    return .success(.init(sku: sku, onHand: onHand, reserved: held, available: onHand - held))\n}\n\npublic func availability(for sku: String, quantity: Int) -> Result<InventorySnapshot, InventoryError> {\n    guard quantity > 0 else { return .failure(.invalidQuantity(quantity)) }\n    return snapshot(for: sku).flatMap { value in\n        value.available >= quantity ? .success(value) : .failure(.insufficientAvailable(sku: sku, requested: quantity, available: value.available))\n    }\n}",
              "rejected": "Storing available as a third mutable counter creates an invariant that every operation must maintain. Deriving it as onHand minus reserved makes disagreement impossible."
            },
            {
              "explanation": "A negative adjustment is really an availability request. Reuse that typed decision before changing stock, so held units can never be consumed.",
              "code": "public func adjustStock(sku: String, by quantity: Int) -> Result<InventorySnapshot, InventoryError> {\n    guard stock[sku] != nil else { return .failure(.unknownSKU(sku)) }\n    if quantity < 0, case let .failure(error) = availability(for: sku, quantity: -quantity) { return .failure(error) }\n    stock[sku, default: 0] += quantity\n    return snapshot(for: sku)\n}",
              "rejected": "Checking only that onHand stays nonnegative ignores reservations; it can leave available stock below zero."
            }
          ]
        },
        {
          "part": 2,
          "steps": [
            {
              "explanation": "Idempotency is the first branch: a replay returns the original value even when every new argument is invalid. Only a new key proceeds through unique-ID and Part 1 availability validation, all within one actor turn.",
              "code": "public func reservation(id: String) -> Result<Reservation, InventoryError> {\n    reservations[id].map(Result.success) ?? .failure(.unknownReservation(id))\n}\n\npublic func reserve(id: String, idempotencyKey: String, sku: String, quantity: Int, expiresAt: Date) -> Result<Reservation, InventoryError> {\n    if let existingID = reservationIDByKey[idempotencyKey], let existing = reservations[existingID] { return .success(existing) }\n    guard reservations[id] == nil else { return .failure(.duplicateReservationID(id)) }\n    if case let .failure(error) = availability(for: sku, quantity: quantity) { return .failure(error) }\n    let value = Reservation(id: id, idempotencyKey: idempotencyKey, sku: sku, quantity: quantity, expiresAt: expiresAt)\n    reservations[id] = value\n    reservationIDByKey[idempotencyKey] = id\n    reserved[sku, default: 0] += quantity\n    return .success(value)\n}",
              "rejected": "A nonisolated check followed by actor mutation can oversell under concurrency. Actor isolation matters because the availability decision and counter update are one serialized operation."
            },
            {
              "explanation": "Centralize terminal bookkeeping in a private transition. Release uses the public lookup seam, then the helper changes the record and decrements reserved exactly once.",
              "code": "private func finish(_ value: Reservation, as state: ReservationState, consumeStock: Bool) -> Reservation {\n    let updated = Reservation(id: value.id, idempotencyKey: value.idempotencyKey, sku: value.sku, quantity: value.quantity, expiresAt: value.expiresAt, state: state)\n    reservations[value.id] = updated\n    reserved[value.sku, default: 0] -= value.quantity\n    if consumeStock { stock[value.sku, default: 0] -= value.quantity }\n    return updated\n}\n\npublic func release(reservationID: String) -> Result<Reservation, InventoryError> {\n    guard case let .success(value) = reservation(id: reservationID) else { return .failure(.unknownReservation(reservationID)) }\n    guard value.state == .active else { return .failure(.reservationNotActive(reservationID)) }\n    return .success(finish(value, as: .released, consumeStock: false))\n}"
            }
          ]
        },
        {
          "part": 3,
          "steps": [
            {
              "explanation": "Expiry selects a deterministic snapshot of eligible active IDs, delegates each transition to release, then relabels the released result as expired without touching counters a second time.",
              "code": "public func expireReservations(at instant: Date) -> [Reservation] {\n    let ids = reservations.values.filter { $0.state == .active && $0.expiresAt <= instant }.map(\\.id).sorted()\n    return ids.compactMap { id in\n        guard case let .success(released) = release(reservationID: id) else { return nil }\n        let expired = Reservation(id: released.id, idempotencyKey: released.idempotencyKey, sku: released.sku, quantity: released.quantity, expiresAt: released.expiresAt, state: .expired)\n        reservations[id] = expired\n        return expired\n    }\n}",
              "rejected": "Duplicating reserved-counter changes in expiry would make release and expiry drift. Calling release establishes one terminal bookkeeping path."
            },
            {
              "explanation": "Commit is a two-phase operation: validate the order ID, nonempty input, and every reservation first; only then apply all transitions and record the order. Actor serialization makes the validate-then-apply section atomic against expiry.",
              "code": "public func commit(orderID: String, reservationIDs: [String]) -> Result<CommittedOrder, InventoryError> {\n    guard orders[orderID] == nil else { return .failure(.duplicateOrderID(orderID)) }\n    guard !reservationIDs.isEmpty else { return .failure(.emptyOrder) }\n    var active: [Reservation] = []\n    for id in reservationIDs {\n        guard case let .success(value) = reservation(id: id) else { return .failure(.unknownReservation(id)) }\n        guard value.state == .active else { return .failure(.reservationNotActive(id)) }\n        active.append(value)\n    }\n    for value in active { _ = finish(value, as: .committed(orderID: orderID), consumeStock: true) }\n    let order = CommittedOrder(id: orderID, reservationIDs: reservationIDs)\n    orders[orderID] = order\n    return .success(order)\n}",
              "rejected": "Validating and committing in the same loop can permanently consume early reservations before a later ID fails. The full validation pass is what gives the method transaction-like behavior."
            }
          ]
        }
      ],
      "reflection": "The transferable concurrency lesson is that an actor protects only code that stays within its isolation boundary. Rich Part 1 results let reservation logic reuse decisions, a single terminal-transition helper protects counters, and validate-then-apply turns serialized access into atomic business behavior."
    },
